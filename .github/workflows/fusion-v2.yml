name: Fusion V2 - Ultra High-Performance Windows Fortress

on:
  workflow_dispatch:
    inputs:
      RUNNER_TIER:
        description: "Execution Infrastructure"
        required: true
        type: choice
        default: "Standard-ARM64-Windows11"
        options:
          - "Standard-x64-Windows2025"
          - "Standard-ARM64-Windows11"
          - "Standard-x64-Windows2022"
          - "Preview-ARM64-VS2026"
      INSTANCE:
        description: "Instance number to deploy"
        required: true
        default: "1"
      COMMAND_PAYLOAD:
        description: "Optional Base64-encoded PowerShell payload (runs after fortress is online)"
        required: false
        default: ""
      FAIL_FAST:
        description: "Halt immediately on payload error"
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [fusion-relay]

permissions:
  contents: write

concurrency:
  group: fusion-fleet
  cancel-in-progress: false

jobs:
  fortress-execute:
    name: "Fortress - Instance ${{ github.event.inputs.INSTANCE || github.event.client_payload.instance || '1' }}"
    timeout-minutes: 350

    runs-on: >-
      ${{
        ((github.event.inputs.RUNNER_TIER || github.event.client_payload.profile) == 'Standard-x64-Windows2025' && 'windows-2025') ||
        ((github.event.inputs.RUNNER_TIER || github.event.client_payload.profile) == 'Standard-ARM64-Windows11' && 'windows-11-arm') ||
        ((github.event.inputs.RUNNER_TIER || github.event.client_payload.profile) == 'Standard-x64-Windows2022' && 'windows-2022') ||
        'windows-11-vs2026-arm'
      }}

    defaults:
      run:
        shell: pwsh

    env:
      EFFECTIVE_TIER: ${{ github.event.inputs.RUNNER_TIER || github.event.client_payload.profile || 'Standard-ARM64-Windows11' }}
      INSTANCE_ID: ${{ github.event.inputs.INSTANCE || github.event.client_payload.instance || '1' }}
      RAW_PAYLOAD: ${{ github.event.inputs.COMMAND_PAYLOAD }}
      FAIL_FAST_INPUT: ${{ github.event.inputs.FAIL_FAST }}
      NGROK_SHAHZAIB: ${{ secrets.NGROK_SHAHZAIB }}
      NGROK_TCP_ADDR: ${{ secrets.NGROK_TCP_ADDR }}
      NGROK_ALLOW_IP: ${{ secrets.NGROK_ALLOW_IP }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DEPLOYMENT_ID: ${{ github.run_id }}
      FAST_SCRATCH: "D:\\fusion-scratch"

    steps:
      - name: Security Sanitization and Secret Masking
        run: |
          foreach ($v in @($env:NGROK_SHAHZAIB, $env:TELEGRAM_BOT_TOKEN, $env:RAW_PAYLOAD)) {
            if (-not [string]::IsNullOrWhiteSpace($v)) { Write-Host "::add-mask::$v" }
          }
          if ([string]::IsNullOrWhiteSpace($env:NGROK_SHAHZAIB)) {
            Write-Error "Missing required secret: NGROK_SHAHZAIB"
            exit 1
          }
          Write-Host "Secrets validated and masked."

      - name: OS Storage and Kernel Performance Tuning
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Write-Host "--- Applying maximum-performance profile ---"

          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'High'
          Write-Host "Thread priority set to HIGH."

          powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 | Out-Null
          powercfg /s e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
          if ($LASTEXITCODE -ne 0) { powercfg /s 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c }
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          Write-Host "Power plan locked to maximum performance."

          Set-MpPreference -DisableRealtimeMonitoring $true -ExclusionPath "C:\","D:\" 2>$null
          Write-Host "Defender real-time scan bypassed."

          Stop-Service wuauserv -Force
          Set-Service wuauserv -StartupType Disabled
          Write-Host "Windows Update suppressed."

          if (Test-Path "D:\") {
            New-Item -ItemType Directory -Path $env:FAST_SCRATCH -Force | Out-Null
            "TEMP=$env:FAST_SCRATCH" >> $env:GITHUB_ENV
            "TMP=$env:FAST_SCRATCH"  >> $env:GITHUB_ENV
            Write-Host "Scratch IO relocated to NVMe: $env:FAST_SCRATCH"
          } else {
            Write-Host "No D: drive found - using default TEMP."
          }

          foreach ($svc in "DiagTrack","dmwappushservice","RetailDemo") {
            Stop-Service $svc -Force
            Set-Service $svc -StartupType Disabled
          }
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Force | Out-Null
          Set-ItemProperty "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Name "DisableWindowsConsumerFeatures" -Value 1
          Write-Host "Telemetry and consumer features disabled."

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          Write-Host "Kernel, storage, and network stack tuned."

      - name: Hypervisor and Hardware Capability Audit
        run: |
          Write-Host "================ REAL ENVIRONMENT TELEMETRY ================"
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $os  = Get-CimInstance Win32_OperatingSystem
          $cs  = Get-CimInstance Win32_ComputerSystem
          $diskC = Get-PSDrive C
          $diskD = Get-PSDrive D -ErrorAction SilentlyContinue
          Write-Host "Tier Requested         : $env:EFFECTIVE_TIER"
          Write-Host "Processor              : $($cpu.Name)"
          Write-Host "Architecture           : $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Physical Cores         : $($cpu.NumberOfCores)"
          Write-Host "Logical vCPUs          : $($cs.NumberOfLogicalProcessors)"
          Write-Host "RAM                    : $([math]::Round($os.FreePhysicalMemory/1MB,2)) GB free / $([math]::Round($cs.TotalPhysicalMemory/1GB,2)) GB total"
          Write-Host "OS                     : $($os.Caption) (Build $($os.BuildNumber))"
          Write-Host "Disk C                 : $([math]::Round($diskC.Free/1GB,2)) GB free"
          if ($diskD) { Write-Host "Disk D (NVMe scratch)  : $([math]::Round($diskD.Free/1GB,2)) GB free" }
          Write-Host "============================================================"

      - name: RDP Access Provisioning
        run: |
          $ErrorActionPreference = 'Stop'
          $RdpUser = "FabricAdmin"
          $RdpPassword = "A123456!"
          Write-Host "Provisioning RDP access for user: $RdpUser"
          $secPass = ConvertTo-SecureString $RdpPassword -AsPlainText -Force
          if (Get-LocalUser -Name $RdpUser -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $RdpUser -Password $secPass -PasswordNeverExpires:$true
            Write-Host "Updated existing user password."
          } else {
            New-LocalUser -Name $RdpUser -Password $secPass -FullName "Fusion Operator" -PasswordNeverExpires -AccountNeverExpires | Out-Null
            Write-Host "Created new user."
          }
          Add-LocalGroupMember -Group "Administrators" -Member $RdpUser -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $RdpUser -ErrorAction SilentlyContinue
          Write-Host "User added to Administrators and Remote Desktop Users."
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force
          Write-Host "RDP enabled and service restarted."

      - name: Tunnel Engine - Verified Fetch and Deploy
        run: |
          $ErrorActionPreference = 'Stop'
          $ngrokDir = "C:\Fusion\ngrok"
          New-Item -ItemType Directory -Force -Path $ngrokDir,"C:\Fusion\Logs" | Out-Null
          Write-Host "Working directory: $ngrokDir"

          $zip = "$ngrokDir\ngrok.zip"
          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Write-Host "Downloading ngrok from: $url"

          $downloadSuccess = $false
          $curlPath = Get-Command curl.exe -ErrorAction SilentlyContinue
          if ($curlPath) {
            Write-Host "curl.exe found at: $($curlPath.Source)"
            & curl.exe --silent --show-error --location --retry 5 --retry-delay 3 --retry-connrefused --retry-max-time 180 --connect-timeout 30 -o $zip $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zip)) {
              $downloadSuccess = $true
              Write-Host "curl download succeeded."
            } else {
              Write-Host "curl failed (exit $LASTEXITCODE), trying Invoke-WebRequest..."
            }
          } else {
            Write-Host "curl.exe not found in PATH."
          }

          if (-not $downloadSuccess) {
            Write-Host "Using Invoke-WebRequest..."
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 120
              $downloadSuccess = $true
              Write-Host "Invoke-WebRequest download succeeded."
            } catch {
              throw "Both download methods failed: $($_.Exception.Message)"
            }
          }

          if (-not (Test-Path $zip)) { throw "Download failed - zip file not found at $zip" }
          $zipSize = (Get-Item $zip).Length
          Write-Host "Downloaded file size: $zipSize bytes"
          if ($zipSize -lt 100000) { throw "Download too small ($zipSize bytes) - likely an error page, not the real binary" }

          Write-Host "Extracting ngrok.zip..."
          Expand-Archive $zip -DestinationPath $ngrokDir -Force
          Remove-Item $zip -Force

          $ngrokExe = "$ngrokDir\ngrok.exe"
          if (-not (Test-Path $ngrokExe)) { throw "ngrok.exe not found after extraction" }
          Write-Host "ngrok.exe extracted successfully."

          Write-Host "Verifying ngrok.exe signature..."
          $sig = Get-AuthenticodeSignature $ngrokExe
          Write-Host "Signature Status : $($sig.Status)"
          Write-Host "Signature Type   : $($sig.SignatureType)"
          if ($sig.SignerCertificate) {
            Write-Host "Signer           : $($sig.SignerCertificate.Subject)"
          } else {
            Write-Host "Signer           : (none)"
          }
          if ($sig.Status -eq "Valid" -and $sig.SignerCertificate -and $sig.SignerCertificate.Subject -match "ngrok") {
            Write-Host "ngrok.exe signature fully verified."
          } elseif ($sig.Status -eq "Valid") {
            Write-Host "Signature valid but signer unexpected: $($sig.SignerCertificate.Subject)"
          } else {
            Write-Host "Signature status: $($sig.Status) - proceeding with caution (may be expected on ARM64 emulation)"
          }

          Write-Host "Writing ngrok configuration..."
          $cfg = "version: 3`nagent:`n  authtoken: $env:NGROK_SHAHZAIB"
          if (-not [string]::IsNullOrWhiteSpace($env:NGROK_ALLOW_IP)) {
            $cfg += "`nendpoints:`n- name: rdp`n  upstream:`n    url: 3389`n  traffic_policy:`n    on_tcp_connect:`n    - actions:`n      - type: restrict-ips`n        config:`n          allow:`n          - $env:NGROK_ALLOW_IP"
          }
          $cfg | Out-File "$ngrokDir\ngrok.yml" -Encoding ascii
          Write-Host "Configuration written."

          Write-Host "Testing ngrok binary..."
          & $ngrokExe --version
          if ($LASTEXITCODE -ne 0) { throw "ngrok.exe failed to execute (exit $LASTEXITCODE)" }
          Write-Host "Tunnel engine staged successfully."

      - name: Fortress Online - Tunnel + Watchdog + Mission Loop
        run: |
          $ErrorActionPreference = 'Continue'
          $ngrokExe = "C:\Fusion\ngrok\ngrok.exe"
          $ngrokYml = "C:\Fusion\ngrok\ngrok.yml"
          $ngrokLog = "C:\Fusion\ngrok\ngrok.log"
          $RdpUser = "FabricAdmin"
          $RdpPassword = "A123456!"
          $ActiveMinutes = 330
          $RelayAt = 330
          $TotalMinutes = 335
          $MaxRestarts = 5
          $restarts = 0
          $relayDone = $false
          $endpoint = $null

          function Send-Telegram([string]$Text) {
            if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN)) { return }
            try {
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" -Method Post -TimeoutSec 30 -Body @{
                chat_id = $env:TELEGRAM_CHAT_ID
                text = $Text
                parse_mode = "HTML"
              } | Out-Null
              Write-Host "Telegram notification sent."
            } catch { Write-Host "Telegram send failed: $($_.Exception.Message)" }
          }

          function Start-Tunnel {
            Write-Host "Starting ngrok tunnel..."
            $a = @("tcp","3389","--config","`"$ngrokYml`"","--log","`"$ngrokLog`"","--log-format","json")
            if ($env:NGROK_TCP_ADDR) {
              $a += "--url"
              $a += "tcp://$env:NGROK_TCP_ADDR"
              Write-Host "Using reserved address: $env:NGROK_TCP_ADDR"
            }
            $p = Start-Process $ngrokExe -ArgumentList $a -PassThru -WindowStyle Hidden
            Write-Host "ngrok process started (PID: $($p.Id))"
            return $p
          }

          function Get-Endpoint {
            Write-Host "Waiting for tunnel endpoint..."
            for ($i = 0; $i -lt 24; $i++) {
              Start-Sleep -Seconds 5
              Write-Host "Checking endpoint (attempt $($i+1)/24)..."
              try {
                $t = Invoke-RestMethod "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
                $u = $t.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
                if ($u.public_url) {
                  $ep = ($u.public_url -replace "^tcp://","")
                  Write-Host "Endpoint found via API: $ep"
                  return $ep
                }
              } catch { }
              if ($proc.HasExited) {
                Write-Host "ngrok process exited unexpectedly."
                if (Test-Path $ngrokLog) {
                  Write-Host "--- ngrok log tail ---"
                  Get-Content $ngrokLog -Tail 20 | ForEach-Object { Write-Host $_ }
                  Write-Host "--- end ngrok log ---"
                }
                throw "ngrok exited prematurely - check authtoken and log above"
              }
            }
            if (Test-Path $ngrokLog) {
              Write-Host "API timeout, checking log for endpoint..."
              $m = Select-String -Path $ngrokLog -Pattern 'url=tcp://([^\s"]+)' | Select-Object -Last 1
              if ($m) {
                $ep = $m.Matches[0].Groups[1].Value
                Write-Host "Endpoint found via log: $ep"
                return $ep
              }
            }
            throw "Tunnel endpoint not detected within 120s"
          }

          Write-Host "=== Bringing fortress online ==="
          $proc = Start-Tunnel
          $endpoint = Get-Endpoint
          Write-Host "RDP endpoint established: $endpoint"

          $onlineMsg = @(
            "Fusion V2 - Instance $env:INSTANCE_ID ONLINE"
            ""
            "RDP:  <code>$endpoint</code>"
            "User: <code>$RdpUser</code>"
            "Pass: <code>$RdpPassword</code>"
            "Tier: $env:EFFECTIVE_TIER"
            "Active: $ActiveMinutes min"
            "Run: $env:DEPLOYMENT_ID"
          ) -join "`n"
          Send-Telegram $onlineMsg

          try {
            $summary = "## Fusion V2 - Instance $env:INSTANCE_ID ONLINE`n| Key | Value |`n|---|---|`n| RDP | ``$endpoint`` |`n| User | ``$RdpUser`` |`n| Pass | ``$RdpPassword`` |`n| Tier | $env:EFFECTIVE_TIER |`n| Window | $ActiveMinutes min |"
            $summary | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } catch { }

          if (-not [string]::IsNullOrWhiteSpace($env:RAW_PAYLOAD)) {
            Write-Host "=== Executing decoded payload ==="
            $payloadPath = Join-Path $env:TEMP ("payload_{0}.ps1" -f $env:DEPLOYMENT_ID)
            try {
              $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:RAW_PAYLOAD))
              Set-Content -Path $payloadPath -Value $decoded -Encoding UTF8
              & powershell.exe -ExecutionPolicy Bypass -File $payloadPath
              if ($LASTEXITCODE -ne 0 -and $env:FAIL_FAST_INPUT -eq 'true') {
                throw "Payload failed with exit code $LASTEXITCODE (FAIL_FAST=true)"
              }
              Write-Host "Payload executed successfully."
            } catch {
              Write-Host "Payload error: $($_.Exception.Message)"
              Send-Telegram "Instance $env:INSTANCE_ID payload failed: $($_.Exception.Message)"
              if ($env:FAIL_FAST_INPUT -eq 'true') { throw }
            } finally {
              Remove-Item $payloadPath -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "No payload provided - skipping."
          }

          $startTime = Get-Date
          Write-Host "=== Sentinel engaged - mission clock started ==="
          while (((Get-Date) - $startTime).TotalMinutes -lt $TotalMinutes) {
            Start-Sleep -Seconds 60
            $elapsed = [int]((Get-Date) - $startTime).TotalMinutes

            if ($proc.HasExited) {
              if ($restarts -ge $MaxRestarts) {
                Write-Host "Tunnel unrecoverable after $MaxRestarts restarts - ending mission"
                Send-Telegram "ALERT: Instance $env:INSTANCE_ID tunnel DEAD - mission aborted"
                exit 1
              }
              $restarts++
              Write-Host "Tunnel down - watchdog restart #$restarts"
              $proc = Start-Tunnel
              try {
                $endpoint = Get-Endpoint
                Send-Telegram ("Instance $env:INSTANCE_ID tunnel re-established`nRDP: <code>$endpoint</code>")
              } catch { Write-Host "Watchdog restart failed: $($_.Exception.Message)" }
            }

            if ($elapsed % 15 -eq 0) { Write-Host "Heartbeat - ${elapsed}m elapsed, $($TotalMinutes-$elapsed)m left" }

            if ($elapsed -ge $RelayAt -and -not $relayDone) {
              $relayDone = $true
              $next = [int]$env:INSTANCE_ID + 1
              Write-Host "Dispatching relay for Instance $next..."
              for ($r = 1; $r -le 3; $r++) {
                try {
                  gh api "repos/$env:REPO/dispatches" -X POST -F "event_type=fusion-relay" -F "client_payload[instance]=$next" -F "client_payload[profile]=$env:EFFECTIVE_TIER" | Out-Null
                  Write-Host "Relay dispatched - Instance $next queued on '$env:EFFECTIVE_TIER'"
                  break
                } catch {
                  Write-Host "Relay attempt $r failed: $($_.Exception.Message)"
                  if ($r -eq 3) { Write-Host "Relay failed after 3 attempts" } else { Start-Sleep ($r * 2) }
                }
              }
            }
          }

          Write-Host "=== Mission teardown ==="
          Get-Process ngrok -ErrorAction SilentlyContinue | Stop-Process -Force
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          $dur = [int]((Get-Date) - $startTime).TotalMinutes
          $nextId = [int]$env:INSTANCE_ID + 1
          $offlineMsg = @(
            "Fusion V2 - Instance $env:INSTANCE_ID OFFLINE"
            ""
            "Relay: Instance $nextId queued ($env:EFFECTIVE_TIER)"
            "Duration: $dur min | Watchdog restarts: $restarts"
            "SHAHZAIB-YT"
          ) -join "`n"
          Send-Telegram $offlineMsg
          Write-Host "Mission complete - Instance $env:INSTANCE_ID signing off."

      - name: Upload Deployment Logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fusion-logs-${{ env.INSTANCE_ID }}
          path: C:\Fusion
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Secure Teardown and Ephemeral Erasure
        if: always()
        run: |
          if (Test-Path $env:FAST_SCRATCH) {
            Remove-Item $env:FAST_SCRATCH -Recurse -Force -ErrorAction SilentlyContinue
          }
          [System.GC]::Collect()
          Write-Host "Scratch purged. Pipeline finalized cleanly."
